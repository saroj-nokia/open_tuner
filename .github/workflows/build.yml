name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Accepts SDK licences so AGP can download the API 37 platform it needs.
      - uses: android-actions/setup-android@v3
      # Installs Gradle itself, so the project doesn't need a committed wrapper jar. AGP 9.4 needs Gradle 9.6+.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Unit tests and debug APK
        run: gradle test assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTuner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
