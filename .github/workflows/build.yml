name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Accepts SDK licences so AGP can download the platform it needs.
      - uses: android-actions/setup-android@v4
      # Installs Gradle itself, so the project doesn't need a committed wrapper jar.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          gradle test assembleDebug --stacktrace 2>&1 | tee build.log
      # Puts the compiler errors in the run's annotations so they can be read without downloading the full log.
      - name: Summarise errors
        if: failure()
        run: |
          msg=$(grep -E '^e: |What went wrong|Execution failed|FAILED' -A2 build.log | sed 's#file:///home/runner/work/open_tuner/open_tuner/app/src/##' | head -40 | paste -sd'|' || true)
          echo "::error title=Build errors::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTuner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
