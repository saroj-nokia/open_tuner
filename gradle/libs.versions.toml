[versions]
# Material 3 1.5.0 pulls Compose 1.12, which needs AGP 9.1+ and compileSdk 37 (AGP 9.4 requires Gradle 9.6).
agp = "9.4.0"
kotlin = "2.4.20"
composeBom = "2025.10.00"
# Expressive APIs (MaterialShapes, ToggleButton, MotionScheme...) are public from the 1.5.0 line; 1.4.0 keeps them internal.
material3 = "1.5.0-beta02"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
coreKtx = "1.17.0"
graphicsShapes = "1.0.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 has Kotlin built in, so there is no org.jetbrains.kotlin.android plugin any more.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
